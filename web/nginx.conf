server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # No unsafe-inline and no unsafe-eval: the widgets build every node
  # through textContent, so the policy costs nothing and turns a mistake in
  # one widget into a blocked script instead of an executed one.
  # "always" keeps them on error answers too. A location that sets its own
  # add_header drops all of these, so none of the locations below does.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location /api/  { proxy_pass http://api:3100; proxy_http_version 1.1; proxy_set_header Host $http_host; }
  location /auth/ { proxy_pass http://api:3100; proxy_http_version 1.1; proxy_set_header Host $http_host; }
  location / { try_files $uri $uri/ /index.html; }
}
