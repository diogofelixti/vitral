services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3100
      # The Google redirect names the host's port; the api has to know it.
      VITRAL_PORT: ${VITRAL_PORT:-8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - vitral-data:/data
      - ./config.yaml:/app/config.yaml:ro
    # No ports: entry. The api holds the Google token and must stay
    # unreachable from the host.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${VITRAL_PORT:-8080}:80"
    depends_on:
      - api
volumes:
  vitral-data:
